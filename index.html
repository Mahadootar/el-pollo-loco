<!doctype html>
<html lang="en" html translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script src="models/drawable-object.class.js"></script>
    <script src="models/moveable.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/background.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/status-health_bar.class.js"></script>
    <script src="models/status-coin_bar.class.js"></script>
    <script src="models/status-bottle_bar.class.js"></script>
    <script src="models/status-endboss_bar.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/end_boss.class.js"></script>
    <script src="models/coins.class.js"></script>
    <script src="models/bottles.class.js"></script>
    <script src="models/throwableObjects.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="js/games.js"></script>
  </head>
  <body>
    <h1>El Pollo Loco</h1>
    <div class="game-container" id="gameContainer">
      <canvas id="canvas" width="720" height="480"> </canvas>
      <div class="mobile-controls">
        <div class="mobile-group">
          <button id="btnLeft" class="mobile-btn">◀</button>
          <button id="btnRight" class="mobile-btn">▶</button>
        </div>
        <div class="mobile-group">
          <button id="btnJump" class="mobile-btn">▲</button>
          <button id="btnThrow" class="mobile-btn">
            <img src="img/7_statusbars/3_icons/icon_salsa_bottle.png" alt="Werfen" />
          </button>
        </div>
      </div>
      <div id="startScreen" class="start-screen">
        <img
          src="img/9_intro_outro_screens/start/startscreen_1.png"
          alt="start-screen-img"
        />
        <button onclick="startGame()">Play The Game</button>
      </div>
      <div id="endScreen" class="end-screen d-none">
        <img src="" id="endScreenImg" alt="Spielende" />
        <button onclick="location.reload()">Nochmal spielen</button>
      </div>
    </div>
    <div class="controls">
      <div class="control">
        <kbd>←</kbd><kbd>→</kbd>
        <span>Laufen</span>
      </div>
      <div class="control">
        <kbd>↑</kbd>
        <span>Springen</span>
      </div>
      <div class="control">
        <kbd>D</kbd>
        <span>Flasche werfen</span>
      </div>
      <button class="fullscreen-btn" onclick="toggleFullscreen()">
        Vollbild
      </button>
    </div>
  </body>
</html>
